name: Build C64 PRG

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install ACME
        run: sudo apt-get update && sudo apt-get install --yes acme
      - name: Assemble
        run: make
      - name: Verify PRG structure
        run: |
          test -s build/subway_3sid_v59.prg
          test "$(wc -c < build/subway_3sid_v59.prg)" -gt 4096
          test "$(od -An -tx1 -N2 build/subway_3sid_v59.prg | tr -d ' \n')" = "0108"
          sha256sum build/subway_3sid_v59.prg | tee build/SHA256SUMS.txt
      - name: Upload PRG
        uses: actions/upload-artifact@v4
        with:
          name: c64-berlin-subway-3sid-prg
          path: build/
          if-no-files-found: error
